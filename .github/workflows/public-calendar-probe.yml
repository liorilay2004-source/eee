name: Official public calendar probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node collector/probe-calendars.mjs
        env:
          COLLECTOR_KEY: ${{ secrets.COLLECTOR_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-calendar-observations
          path: calendar-probe.json
          retention-days: 1
