name: Official published fare page probe
on:
  workflow_dispatch:
    inputs:
      candidates:
        description: Probe additional approved pages without publishing
        type: boolean
        default: false
      airline:
        description: Optional candidate airline code
        type: string
        default: ''
  schedule:
    - cron: '6,16,26,36,46,56 * * * *'
concurrency:
  group: official-published-fares-${{ inputs.candidates || false }}-${{ inputs.airline || 'all' }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || vars.EXTERNAL_PUBLISHED_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node collector/probe-public-pages.mjs
        env:
          COLLECTOR_KEY: ${{ secrets.COLLECTOR_KEY }}
          PROBE_CANDIDATES: ${{ inputs.candidates }}
          PROBE_AIRLINE: ${{ inputs.airline }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-public-page-observations
          path: public-page-probe.json
          retention-days: 1
