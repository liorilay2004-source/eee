name: Official published fare page probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node collector/probe-public-pages.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: official-public-page-observations
          path: public-page-probe.json
          retention-days: 1
