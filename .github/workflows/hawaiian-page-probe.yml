name: Inspect official Hawaiian public fare records
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hawaiian-public-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test collector/fare-records.test.mjs
      - run: node collector/probe-hawaiian-pages.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hawaiian-public-observations
          path: hawaiian-page-observations.json
          retention-days: 3
