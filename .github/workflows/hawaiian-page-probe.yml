name: Inspect official Hawaiian public fare records
on:
  workflow_dispatch:
    inputs:
      origins:
        type: boolean
        default: false
        description: Inspect actually observed origin pages
      offset:
        type: number
        default: 0
      limit:
        type: number
        default: 20
permissions:
  contents: read
concurrency:
  group: hawaiian-public-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test collector/fare-records.test.mjs
      - run: node collector/probe-hawaiian-pages.mjs
        env:
          HAWAIIAN_ORIGINS: ${{ inputs.origins }}
          HAWAIIAN_OFFSET: ${{ inputs.offset }}
          HAWAIIAN_LIMIT: ${{ inputs.limit }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hawaiian-public-observations
          path: hawaiian-page-observations.json
          retention-days: 3
