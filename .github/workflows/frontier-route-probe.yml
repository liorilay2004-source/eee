name: Observed Frontier route price discovery
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontier-route-discovery
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test collector/route-links.test.mjs
      - run: node collector/probe-frontier-routes.mjs
        env:
          FRONTIER_PAGE_KIND: origins
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-route-observations
          path: frontier-route-observations.json
          retention-days: 1
