name: Observed Singapore Airlines public fare data probe
on:
  workflow_dispatch:
concurrency:
  group: singapore-external-fares
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || vars.EXTERNAL_SINGAPORE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test collector/singapore-observations.test.mjs
      - run: node collector/probe-singapore-pages.mjs
        env:
          COLLECTOR_KEY: ${{ secrets.COLLECTOR_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: singapore-official-observations
          path: |
            singapore-upstream-rows.json
            singapore-observations.json
          retention-days: 1
