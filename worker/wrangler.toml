name = "eee-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Build info for GET /api/health (commit + time): wrangler runs this before every `npx wrangler deploy` (and `wrangler dev`),
# no extra step. It writes build/build-info.js (git-ignored), which the alias below serves as the module "eee-build-info".
# Without git the commit reads "unknown"; the script never fails the deploy.
# Wrangler runs this in the shell's current folder, not this file's, so the fallback keeps
# `npx wrangler deploy --config worker/wrangler.toml` from the repo root working too (from worker/ the first part runs;
# from the root node first prints a harmless "Cannot find module", then the second part runs).
[build]
command = "node scripts/gen-build-info.mjs || node worker/scripts/gen-build-info.mjs"

[alias]
"eee-build-info" = "./build/build-info.js"

[vars]
ALLOWED_ORIGIN = "https://eee-web-bly.pages.dev"
RYANAIR_DIRECT_ENABLED = "true"
AEGEAN_PUBLISHED_ENABLED = "true"
AIRCANADA_PUBLISHED_ENABLED = "true"
TAP_PUBLISHED_ENABLED = "true"
ETHIOPIAN_PUBLISHED_ENABLED = "true"
AIREUROPA_PUBLISHED_ENABLED = "true"
PHILIPPINE_PUBLISHED_ENABLED = "true"
VIRGIN_PUBLISHED_ENABLED = "true"
AIRNZ_PUBLISHED_ENABLED = "true"
AIRBALTIC_PUBLISHED_ENABLED = "true"
SKYEXPRESS_PUBLISHED_ENABLED = "true"
GOL_PUBLISHED_ENABLED = "true"
AERLINGUS_PUBLISHED_ENABLED = "true"
AMERICAN_PUBLISHED_ENABLED = "true"
KLM_RENDERED_ENABLED = "true"
AEROMEXICO_RENDERED_ENABLED = "true"
AIRSERBIA_DIRECT_ENABLED = "true"

# Created in the owner's Cloudflare account on 2026-09-29 (not a secret: it only identifies the database).
[[d1_databases]]
binding = "DB"
database_name = "eee-db"
database_id = "fe66df0f-f5ea-48af-8ccb-ea4e99c17145"
migrations_dir = "migrations"

# Daily retention (prices of past trips, old search log, dead rate-limit and cache rows), an hourly price snapshot
# of one watchlist route (src/snapshots.ts): the history that deal detection needs, and the hourly price-alert batch
# (src/watches.ts: a bounded batch per run, each watch checked about once a day). Workers Free allows 5 cron triggers.
[triggers]
crons = ["17 3 * * *", "43 * * * *", "29 * * * *"]

# Secrets (never in this file): `wrangler secret put TRAVELPAYOUTS_TOKEN`, `TRAVELPAYOUTS_MARKER`, `RATE_LIMIT_SALT`.
# Local runs read them from worker/.dev.vars (see .dev.vars.example).
# OPTIONAL live fare sources, each only with its vendor's FREE plan and NEVER with a payment card: `IGNAV_API_KEY`,
# `WEGO_API_TOKEN`, `SEARCHAPI_KEY`, `SERPAPI_KEY`, `HASDATA_API_KEY`, `DUFFEL_API_TOKEN`. Duffel live tokens also need plain var
# `DUFFEL_ALLOW_LIVE = "true"`; test tokens do not. A source without its safe secret is not used and costs nothing; every
# one has a hard request cap below its free/safe allowance (src/sources/), counted in D1 by migration 0004.
# OPTIONAL price alerts over the free Telegram Bot API (src/telegram.ts): secrets `TELEGRAM_BOT_TOKEN` and
# `TELEGRAM_WEBHOOK_SECRET`, plus the plain variable `TELEGRAM_BOT_USERNAME` (dashboard: Settings -> Variables). Without all
# three the alert channel is off: POST /api/watches answers 503 and the webhook 404. Needs migration 0006.
# OPTIONAL private-use lock (src/access.ts): the secret `ACCESS_KEY`, 20-256 visible ASCII characters. Unset = the API is
# public; set = every call but /api/health, the Telegram webhook and CORS preflights needs "Authorization: Bearer <key>".
# Set it with `npx wrangler secret put ACCESS_KEY`, never here (docs/CLOUDFLARE_SETUP.md, section 6ג).

[browser]
binding = "BROWSER"

